project_id = "vidyalayaa-local"
[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[studio]
port = 54323
[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://127.0.0.1:5173/auth/callback", "http://localhost:5173/auth/google/callback", "http://127.0.0.1:5173/auth/google/callback"]

enable_signup = false
minimum_password_length = 12
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Hosted Supabase: configure Google in Authentication > Sign In / Providers.
# Local Supabase: enable this block only after creating a Google Web OAuth client.
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
# skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "10MiB"
