project_id = "vidyalayaa-local"
[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[studio]
port = 54323
[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://127.0.0.1:5173/auth/callback", "http://localhost:5173/auth/google/callback", "http://127.0.0.1:5173/auth/google/callback", "http://localhost:5173/auth/verify", "http://127.0.0.1:5173/auth/verify"]

enable_signup = false
minimum_password_length = 12
[auth.email]
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
otp_expiry = 1800
otp_length = 6

[auth.email.template.confirmation]
subject = "Confirm your email | Vidyalayaa"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.invite]
subject = "You’re invited to Vidyalayaa"
content_path = "./supabase/templates/invite.html"
[auth.email.template.magic_link]
subject = "Your secure sign-in | Vidyalayaa"
content_path = "./supabase/templates/magic_link.html"
[auth.email.template.email_change]
subject = "Confirm your email change | Vidyalayaa"
content_path = "./supabase/templates/email_change.html"
[auth.email.template.recovery]
subject = "Choose your password | Vidyalayaa"
content_path = "./supabase/templates/recovery.html"
[auth.email.template.reauthentication]
subject = "Verify your identity | Vidyalayaa"
content_path = "./supabase/templates/reauthentication.html"
[auth.email.notification.password_changed]
enabled = true
subject = "Your password was changed | Vidyalayaa"
content_path = "./supabase/templates/password_changed_notification.html"
[auth.email.notification.email_changed]
enabled = true
subject = "Your email was changed | Vidyalayaa"
content_path = "./supabase/templates/email_changed_notification.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Hosted Supabase: configure Google in Authentication > Sign In / Providers.
# Local Supabase: enable this block only after creating a Google Web OAuth client.
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
# skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "10MiB"
