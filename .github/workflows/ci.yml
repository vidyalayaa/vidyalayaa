name: Validate Vidyalayaa
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: vidyalayaa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local_ci_password@localhost:5432/vidyalayaa_test
      MIGRATION_DATABASE_URL: postgresql://postgres:local_ci_password@localhost:5432/vidyalayaa_test
      DB_SSL: 'false'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @vidyalayaa/contracts
      - run: npm run typecheck
      - run: npm test
      - run: npx tsx scripts/prepare-test-db.ts
      - run: npm run db:migrate
      - run: npm run db:verify
      - run: npm run test:integration
      - run: npm run contracts
      - run: git diff --exit-code docs/api/openapi.json
      - run: npm run build
      - run: npm run check:secrets
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/workspace.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
          retention-days: 14
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - run: pio run -d firmware
