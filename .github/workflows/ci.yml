name: Validate Vidyalayaa
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: vidyalayaa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local_ci_password@localhost:5432/vidyalayaa_test
      MIGRATION_DATABASE_URL: postgresql://postgres:local_ci_password@localhost:5432/vidyalayaa_test
      DB_SSL: 'false'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @vidyalayaa/contracts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx tsx scripts/prepare-test-db.ts
      - run: npm run db:migrate
      - run: npm run db:verify
      - run: npm run test:integration
      - run: npm run contracts
      - run: git diff --exit-code docs/api/openapi.json firmware/include/protocol.generated.h
      - run: npm run build
      - run: npm run check:secrets
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/workspace.spec.ts tests/e2e/mfa.spec.ts tests/e2e/auth-callback.spec.ts tests/e2e/google-login.spec.ts tests/e2e/onboarding.spec.ts tests/e2e/school-workflows.spec.ts tests/e2e/platform.spec.ts tests/e2e/audit-workflows.spec.ts --workers=2
      - run: npx playwright test tests/e2e/fees.spec.ts tests/e2e/fees-roles.spec.ts --workers=1
      - run: npx playwright test tests/e2e/login-sessions.spec.ts --workers=1
      - run: npx playwright test tests/e2e/student-csv.spec.ts --workers=1
      - run: npx playwright test tests/e2e/explore.spec.ts --workers=1
      - run: npx playwright test tests/e2e/notifications.spec.ts tests/e2e/notifications-family.spec.ts tests/e2e/notifications-staff.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
          retention-days: 14
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --verbose --redact

  # Firmware development and its build gates are deferred by the owner until website completion.
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag vidyalayaa:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vidyalayaa:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
